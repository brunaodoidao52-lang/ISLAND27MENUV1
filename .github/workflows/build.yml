name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run DSP core tests
        run: |
          cmake -S . -B build -DISLANDEQ_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure

  melodyforge-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: MelodyForge core tests (JS)
        run: node melodyforge/tests/core.test.js
      - name: Golden vectors are up to date
        run: |
          node melodyforge/tests/make_golden.js
          git diff --exit-code melodyforge/tests/golden/golden.txt
      - name: Melody Generator theory tests (C++)
        run: |
          cmake -S melodyforge/plugin -B mf-build -DMELODYFORGE_BUILD_PLUGIN=OFF
          cmake --build mf-build
          ctest --test-dir mf-build --output-on-failure

  melodyforge-plugin:
    needs: melodyforge-tests
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: windows-x64
          - os: macos-14
            name: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Timbre bank (100 instruments from Fluid R3, MIT)
        shell: bash
        run: |
          curl -sSL -o FluidR3_GM.sf2 https://github.com/pianobooster/fluid-soundfont/releases/download/v3.1/FluidR3_GM.sf2
          python melodyforge/tools/make_soundbank.py FluidR3_GM.sf2
      - name: Configure
        shell: bash
        run: |
          extra=""
          if [ "$RUNNER_OS" == "macOS" ]; then extra="-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"; fi
          cmake -S melodyforge/plugin -B mf-build -DCMAKE_BUILD_TYPE=Release -DMELODYFORGE_BUILD_TESTS=OFF $extra
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build mf-build --config Release --parallel 4 2>&1 | tee build-${{ matrix.name }}.log
      - name: Publish build log (on failure)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -nE "error|Error" build-${{ matrix.name }}.log | head -200 > errors-${{ matrix.name }}.txt || true
          gh release view ci-logs >/dev/null 2>&1 || gh release create ci-logs --prerelease --title "CI logs" --notes "Logs de compilação" --target "$GITHUB_SHA"
          gh release upload ci-logs build-${{ matrix.name }}.log errors-${{ matrix.name }}.txt --clobber
      - name: Publish Windows package
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=mf-build/MelodyForge_artefacts/Release
          mkdir -p pkg
          cp -r "$R/VST3/Melody Generator.vst3" pkg/
          cp "$R/Standalone/Melody Generator.exe" pkg/
          cp melodyforge/plugin/LEIA-ME.txt pkg/
          (cd pkg && 7z a -tzip ../Melody-Generator-windows-x64.zip . > /dev/null)
          gh release view melody-generator-3.0 >/dev/null 2>&1 || gh release create melody-generator-3.0 --prerelease --title "Melody Generator 3.0 (teste)" --notes "VST3 + app para Windows" --target "$GITHUB_SHA"
          gh release upload melody-generator-3.0 Melody-Generator-windows-x64.zip --clobber
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Melody-Generator-${{ matrix.name }}
          path: |
            melodyforge/plugin/LEIA-ME.txt
            mf-build/MelodyForge_artefacts/Release/Standalone
            mf-build/MelodyForge_artefacts/Release/VST3
            mf-build/MelodyForge_artefacts/Release/AU
          if-no-files-found: ignore

  plugin:
    needs: core-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: windows-x64
          - os: macos-14
            name: macos-universal
          - os: ubuntu-24.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev ninja-build

      - name: Configure
        shell: bash
        run: |
          extra=""
          if [ "$RUNNER_OS" == "macOS" ]; then extra="-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DISLANDEQ_BUILD_TESTS=OFF $extra

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: IslandParametricEQ-${{ matrix.name }}
          path: |
            build/IslandParametricEQ_artefacts/Release/Standalone
            build/IslandParametricEQ_artefacts/Release/VST3
            build/IslandParametricEQ_artefacts/Release/AU
          if-no-files-found: ignore
