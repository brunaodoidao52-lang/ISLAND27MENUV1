name: ISLAND27 Editor - instaladores

# Gera os instaladores para Windows, macOS e Linux.
# - Manualmente: aba Actions > "ISLAND27 Editor - instaladores" > Run workflow (baixe em "Artifacts").
# - Publicação: crie uma tag "editor-v1.0.0" e os instaladores vão para a página de Releases.
on:
  workflow_dispatch:
  push:
    tags: ['editor-v*']
    branches: ['**']
    paths: ['video-editor/**', '.github/workflows/editor-instaladores.yml']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: --win --x64
            test: true
          - name: macos-apple-silicon
            os: macos-14
            args: --mac --arm64
            test: true
          - name: macos-intel
            os: macos-14
            args: --mac --x64
            arch: x64
            test: false
          - name: linux
            os: ubuntu-latest
            args: --linux --x64
            test: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: video-editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video-editor/package-lock.json
      - name: Instalar dependências
        timeout-minutes: 10
        run: npm ci
        env:
          # Baixa o FFmpeg da arquitetura certa (ex.: Intel num Mac Apple Silicon).
          npm_config_arch: ${{ matrix.arch }}
      - name: Diagnóstico do FFmpeg
        if: matrix.name == 'macos-apple-silicon'
        timeout-minutes: 8
        run: node test/diagnostico.js
      - name: Testes de exportação
        if: matrix.test
        timeout-minutes: 10
        run: npm test
      - name: Gerar instalador
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Compactar o app portátil em .rar
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          choco install winrar -y --no-progress
          $exe = Get-ChildItem dist/*-Portatil.exe | Select-Object -First 1
          & "C:\Program Files\WinRAR\Rar.exe" a -ep1 -m5 "dist/ISLAND27-Editor-Windows.rar" $exe.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: ISLAND27-Editor-${{ matrix.name }}
          path: |
            video-editor/dist/*.exe
            video-editor/dist/*.rar
            video-editor/dist/*.dmg
            video-editor/dist/*.AppImage
            video-editor/dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    # Publica o que ficou pronto mesmo se algum sistema falhar.
    if: always() && startsWith(github.ref, 'refs/tags/editor-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: ISLAND27 Editor ${{ github.ref_name }}
          files: instaladores/*
